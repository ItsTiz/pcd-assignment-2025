akka {
  actor {
    provider = cluster
  }

  remote {
    artery {
      canonical.hostname = "127.0.0.1"
      canonical.port = 0
    }
  }

  cluster {
    seed-nodes = [
      "akka://agario-cluster@127.0.0.1:25251",
      "akka://agario-cluster@127.0.0.1:25252"
    ]
    downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"
  }

}
akka.cluster.jmx.multi-mbeans-in-same-jvm = on
